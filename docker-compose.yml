services:
  postgres:
    image: postgres:16-alpine
    container_name: bisayasafe-postgres
    environment:
      POSTGRES_USER: bisayasafe
      POSTGRES_PASSWORD: bisayasafe
      POSTGRES_DB: bisayasafe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisayasafe -d bisayasafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: bisayasafe-chroma
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata:
